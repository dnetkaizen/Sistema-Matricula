services:
  db:
    image: postgres:16-alpine
    container_name: universidad_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: matricula-backend:latest
    container_name: matricula_backend
    env_file: .env
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
